name: Publish to NPM

on:
  push:
    branches:
      - main
    # Skip changes that don't alter the published package.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'mkdocs.yml'
      - 'mkdocs_hooks.py'
      - 'CITATION.cff'
      - '.github/**'
      - 'Dockerfile'
      - '.dockerignore'

permissions:
  contents: read

jobs:
  # Third-party code (npm ci, tests) runs here, without publish credentials.
  test:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      # The tests run the server against fake docker and dnstwist binaries.
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write  # push the version bump and tag
      id-token: write  # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Install and build
        run: |
          npm ci --ignore-scripts
          npm run build

      # Bump locally and push only after npm accepted the package, so a failed
      # publish never leaves a tagged-but-unpublished version behind.
      - name: Bump version
        run: |
          # A version set by hand (e.g. a minor release) is published as is;
          # otherwise bump the patch version.
          CURRENT=$(node -p "require('./package.json').version")
          if npm view "@burtthecoder/mcp-dnstwist@$CURRENT" version >/dev/null 2>&1; then
            npm version patch --no-git-tag-version
          fi
          NEW_VERSION=$(node -p "require('./package.json').version")
          # Keep the MCP Registry manifest in step with the package version.
          sed -i "s/\"version\": \".*\"/\"version\": \"$NEW_VERSION\"/g" server.json
          git add package.json package-lock.json server.json
          git diff --cached --quiet || git commit -m "Bump version to $NEW_VERSION [skip ci]"
          git tag "v$NEW_VERSION"

      - name: Publish to NPM (trusted publishing via OIDC)
        run: npm publish --access public

      - name: Push version bump and tag
        run: |
          git push
          git push --tags

      # The MCP Registry listing is published by mcp-registry.yml after this
      # workflow succeeds, once npm shows the new version.
